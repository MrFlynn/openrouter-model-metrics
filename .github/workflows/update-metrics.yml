name: Update Model Metrics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.15.1"

      - name: Scrape metrics
        timeout-minutes: 5
        run: uv run metrics-scrape -m all model-metrics.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit and push changes
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "actions@user.noreply.github.com"
          git config --local user.name "Archive"

          # Prevent conflicts due to changes being made while workflow is
          # running. This workflow can take a while, so it's prudent to pull
          # before commit anything new.
          git pull --rebase --autostash

          git add model-metrics.json
          git commit -m "Metrics from $(date -u)" || exit 0
          git push
