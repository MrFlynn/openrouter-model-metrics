[project]
name = "openrouter-model-metrics"
description = "Collect AI model performance metrics from openrouter.ai"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[project.scripts]
metrics-scrape = "metrics_scrape.scrape:main"

[tool.basedpyright]
exclude = ["git-history-convert.py"]
reportAny = "none"

[tool.uv]
package = true
